name: Android Debug APK Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@c28421964b27e627827abf8cf128e97dcfd97512 # v4.3.7

      - name: Set up JDK 17
        uses: actions/setup-java@a4a4eea2808f05f4d9fc20cfd393781bc09e5cbf # v4.7.0
        with:
          distribution: 'zulu'
          java-version: 17
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@d90dcf7e5fad86bc4b17c3e43b1b71c6fbcb814c # v4.2.5

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: List APK files
        run: |
          ls -la app/build/outputs/apk/debug/
          find app/build/outputs -name "*.apk" -type f

      - name: Upload APK artifact
        uses: actions/upload-artifact@26f96dfa697d6818b398faafafb8d973d830a5ec # v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
