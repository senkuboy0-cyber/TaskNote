name: Android Debug APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup JDK 17
        uses: actions/setup-java@3a4f502f3185ef536b243aef5f6245fff5cf3ed3
        with:
          distribution: 'zulu'
          java-version: 17
          cache: gradle

      - name: Setup Gradle Wrapper
        uses: gradle/actions/setup-gradle@d90dcf7e5fad86bc4b17c3e43b1b71c6fbcb814c
        with:
          cache-disabled: false

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: List APK files
        run: find app/build/outputs -name "*.apk" -type f

      - name: Upload APK artifact
        uses: actions/upload-artifact@354159b97204dc2fbcfb295fb54c93b7863c93e5
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
