name: Android Debug APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: gradle

      - name: Install Gradle & Generate Wrapper JAR
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Copy Wrapper JAR from temp project
        run: |
          mkdir -p /tmp/gradle-temp
          cd /tmp/gradle-temp
          gradle wrapper --gradle-version 8.11.1
          mkdir -p $GITHUB_WORKSPACE/gradle/wrapper
          cp gradle/wrapper/gradle-wrapper.jar $GITHUB_WORKSPACE/gradle/wrapper/

      - name: Grant execute permission for gradlew
        run: chmod +x $GITHUB_WORKSPACE/gradlew

      - name: Build Debug APK
        working-directory: ${{ github.workspace }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: List APK files
        run: find app/build/outputs -name "*.apk" -type f

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
